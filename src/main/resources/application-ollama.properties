# Use a local Ollama for the investing AI features: nothing leaves this machine and nothing costs money.
# Activate with:  --spring.profiles.active=local,ollama   (or SPRING_PROFILES_ACTIVE=local,ollama)
# Needs Ollama running (https://ollama.com) and the model pulled:  ollama pull qwen2.5:7b-instruct
# Change ai.provider.model to any model you have pulled; override per machine in application-local.properties.
ai.enabled=true
ai.provider.type=ollama
ai.provider.base-url=http://localhost:11434/v1
ai.provider.model=qwen2.5:7b-instruct
# No quota to protect, only a slow CPU: allow more calls, keep the per-minute cap low.
ai.limits.daily-total=500
ai.limits.per-minute=4
