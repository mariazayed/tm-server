spring.application.name=tm-server
# Defaults to the local profile so `application-local.properties` (real DB
# creds, gitignored) loads automatically with no extra run-config needed.
# Override with -Dspring.profiles.active=<other> for other environments later.
spring.profiles.active=local
# PostgreSQL connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/tm_db
#spring.datasource.url=jdbc:postgresql://localhost:5432/tm_db_test
# Username/password are intentionally not set here -- they live in the untracked
# application-local.properties (copy application-local.properties.example),
# loaded via the "local" Spring profile so real credentials never reach git.
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate settings (optional but recommended)
# Flyway (src/main/resources/db/migration) owns the schema now; validate just
# checks entities match it at startup instead of letting Hibernate alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.server.port=8080
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway: on a fresh database there is no base schema to migrate -- the base
# tables/columns pre-date Flyway and are created by Hibernate the first time
# the app was run with ddl-auto=update. Baselining at the latest applied
# migration (V15) records "everything up to here is already applied" without
# running anything, so a Hibernate-bootstrapped database starts clean and
# only future migrations (V16+) run. Do not lower this unless you know the
# database genuinely predates all of V1..V15.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=15
spring.flyway.baseline-description=Baseline before introducing versioned migrations
# Jackson 3 (Spring Boot 4) rejects unused primitive fields (e.g. the
# importer deliberately omits `pips`) unless FAIL_ON_NULL_FOR_PRIMITIVES is
# turned off. Restores the pre-upgrade default-0 behavior.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# AI-suggested analysis fields (Phase 5) -- off by default. Turn on once
# ai.provider.api-key and ai.provider.model are set in the untracked
# application-local.properties (see application-local.properties.example).
# Never touches an already-reviewed trade, and only ever fills fields that
# are still null -- see AiSuggestionService.
ai.suggestions.enabled=true
# Investing tracker AI features (chat, journal assistant). They use a local Ollama by default: free, nothing
# leaves this machine. Run Ollama and `ollama pull qwen2.5:7b-instruct`, nothing else to set. To use another
# provider override ai.provider.* in application-local.properties (see application-local.properties.example:
# Anthropic, Gemini, Groq, OpenRouter). The limits below bound spending, since the API has no login: calls per
# UTC day (all features), calls per rolling minute, and the largest prompt in characters. Over a limit the API
# answers 429; nothing is sent.
ai.provider.type=ollama
ai.provider.base-url=http://localhost:11434/v1
ai.provider.model=qwen2.5:7b-instruct
ai.enabled=true
ai.limits.daily-total=500
ai.limits.per-minute=4
ai.limits.max-prompt-chars=20000
# Investing tracker price refresh (daily close of the settings ticker via Yahoo Finance).
# Off by default; POST /api/v1/invest/prices/refresh always works for a manual refresh.
# Several funds. On by default; set to false to allow only one fund, in which case a second is refused.
invest.holdings.multiple=true
invest.prices.enabled=false
# Spring cron, UTC. Default: 23:30 every day.
# invest.prices.refresh-cron=0 30 23 * * *
# Investing tracker reminders. Two switches: invest.reminders.enabled runs the daily job on the
# server; the reminders toggle in the app's settings decides whether you get emails. Email needs SMTP:
#   spring.mail.host=smtp.example.com
#   spring.mail.port=587
#   spring.mail.username=...        (use env vars SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   invest.reminders.from=you@example.com
invest.reminders.enabled=false
# invest.reminders.cron=0 0 9 * * *
# Investing tracker nightly JSON backup (everything the tracker stores, owner-only files).
# Off by default. For a full database dump use scripts/backup-invest-db.sh as well.
invest.backup.enabled=false
# invest.backup.dir=backups
# invest.backup.keep=14
# invest.backup.cron=0 30 2 * * *
# Largest request body accepted on /api/v1/invest/** (bytes). Default 2 MiB.
# app.max-body-bytes=2097152
# Product areas. Trading (trade journal, calendar, strategies, assets, risk) is hidden by default; this app
# is investing-first. Set to true to bring it back. Only visibility changes, no data is touched.
# GET /api/v1/features reports the current state to clients.
features.trading.enabled=false
