name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # contextLoads needs a migrated local PostgreSQL, so it is excluded here.
      - run: mvn -B verify -Dtest='!TmServerApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
